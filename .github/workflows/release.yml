# Publishes a version when the version number in crates/mulu-app/tauri.conf.json
# changes on the main branch (that is, when a reviewed pull request that bumps it is
# merged) and no release with that number exists yet. Builds the installers and
# publishes them as a pre-release with checksums and a build provenance attestation.
# The release creates the matching tag (v0.0.1, v0.1.0, ...).
#
# Security (decision D12):
# - installers are built only here, from the public code, never on a personal computer;
# - every third-party action is pinned to an exact commit;
# - only the final publishing job can write, and only to the release and attestations.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "crates/mulu-app/tauri.conf.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Is there a new version?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version crates/mulu-app/tauri.conf.json)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing ${tag}."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            target_args: ""
          - name: macOS
            # Intel runner, building a universal app for Apple silicon and Intel Macs.
            os: macos-15-intel
            bundles: dmg
            target_args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Add both Mac architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # The PDF engine's library (D28), checked against its pinned checksum and
      # shipped inside the installer with its licenses.
      - name: Fetch the PDF engine
        shell: bash
        run: scripts/fetch-pdfium.sh ${{ runner.os == 'Windows' && 'win-x64' || 'mac-univ' }}
      - name: Install the Tauri command-line tool (pinned version)
        run: cargo install tauri-cli --version 2.12.6 --locked
      - name: Build the installer
        working-directory: crates/mulu-app
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }} ${{ matrix.target_args }}
      - name: Collect the installer
        shell: bash
        run: |
          mkdir dist
          find target -type f \( -path '*/bundle/nsis/*.exe' -o -path '*/bundle/dmg/*.dmg' \) -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish pre-release
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Add the Windows Sandbox file for testers
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          sed "s/VERSION/${TAG}/" docs/testing/mulu-sandbox.wsb > "dist/Mulu-${TAG}-test-sandbox.wsb"
      - name: Compute checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Create the pre-release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Mulu ${TAG} (test version)" \
            --notes-file "docs/releases/${TAG}.md"
