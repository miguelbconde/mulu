# Runs the automated checks on every proposed change, on Windows, macOS and Linux.
# Security (decision D12): read-only permissions, third-party actions pinned to an
# exact commit, no stored credentials.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on GitHub's Intel runner: on 19 Nov 2026 the Apple silicon (arm64)
        # pool had no capacity for every run, so those jobs were cancelled and marked the
        # whole run as failed. The release still builds a universal app for both kinds of
        # Mac. Add macos-latest back when its queue is reliable.
        os: [windows-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The compiler version comes from rust-toolchain.toml.
      # The release workflow publishes a version with docs/releases/vX.Y.Z.md as its
      # notes; a missing file only fails after merging, when the installers are
      # already built. Check it here, in the proposal.
      - name: Release notes for the version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/mulu-app/Cargo.toml | head -1)
          test -s "docs/releases/v${version}.md" || { echo "::error::docs/releases/v${version}.md is missing"; exit 1; }
          test -s "docs/testing/v${version}.md" || { echo "::error::docs/testing/v${version}.md is missing"; exit 1; }

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # The desktop window uses the system web view; Linux needs its development files.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # The PDF engine's library (D28), checked against its pinned checksum.
      - name: Fetch the PDF engine
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) platform=win-x64 ;;
            macOS) platform=mac-univ ;;
            *) platform=linux-x64 ;;
          esac
          library="$(scripts/fetch-pdfium.sh "$platform")"
          # On Windows, a Windows-style path for the tests.
          if [ "$RUNNER_OS" = "Windows" ]; then library="$(cygpath -w "$library")"; fi
          echo "MULU_PDFIUM=$library" >> "$GITHUB_ENV"
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --all-targets --locked
